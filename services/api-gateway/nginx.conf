# API Gateway Configuration for Auto Claude Marketing Hub
# This Nginx configuration serves as the entry point for all microservices

events {
    worker_connections 1024;
}

http {
    # Upstream services
    upstream campaign_service {
        least_conn;
        server campaign-service:8001;
        keepalive 32;
    }

    upstream content_service {
        least_conn;
        server content-service:8002;
        keepalive 32;
    }

    upstream analytics_service {
        least_conn;
        server analytics-service:8003;
        keepalive 32;
    }

    upstream notification_service {
        least_conn;
        server notification-service:8004;
        keepalive 32;
    }

    upstream integration_service {
        least_conn;
        server integration-service:8005;
        keepalive 32;
    }

    upstream frontend_app {
        server frontend:3000;
        keepalive 32;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=50r/s;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml;

    server {
        listen 8080;
        server_name localhost;

        # Client body size limit
        client_max_body_size 50M;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Service health checks
        location /health/services {
            access_log off;
            proxy_pass http://consul:8500/v1/health/state/any;
        }

        # API routes with rate limiting
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            # CORS headers
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-ID" always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Max-Age 86400 always;

            if ($request_method = OPTIONS) {
                return 204;
            }

            # Request ID for tracing
            proxy_set_header X-Request-ID $request_id;

            # Proxy settings
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Auth endpoint bypass
            rewrite ^/api/auth/(.*)$ /auth/$1 break;
            proxy_pass http://integration-service:8005;

            # Service routing
            rewrite ^/api/campaigns/(.*)$ /$1 break;
            proxy_pass http://campaign_service;

            rewrite ^/api/content/(.*)$ /$1 break;
            proxy_pass http://content_service;

            rewrite ^/api/analytics/(.*)$ /$1 break;
            proxy_pass http://analytics_service;

            rewrite ^/api/notifications/(.*)$ /$1 break;
            proxy_pass http://notification_service;

            rewrite ^/api/integrations/(.*)$ /$1 break;
            proxy_pass http://integration_service;
        }

        # Auth endpoint with stricter rate limiting
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;

            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass http://integration-service:8005/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Webhook endpoint
        location /api/webhooks/ {
            limit_req zone=webhook_limit burst=100 nodelay;

            # No auth for webhooks (they verify via signatures)
            proxy_pass http://integration-service:8005/webhooks/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # GraphQL endpoint (if using GraphQL)
        location /graphql {
            limit_req zone=api_limit burst=20 nodelay;

            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

            if ($request_method = OPTIONS) {
                return 204;
            }

            proxy_pass http://campaign-service:8001/graphql;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WebSocket support for real-time features
        location /ws/ {
            proxy_pass http://notification-service:8004/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400;
        }

        # Static files and frontend
        location / {
            proxy_pass http://frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Static assets caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://frontend_app;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # HTTPS server (uncomment for production)
    # server {
    #     listen 443 ssl http2;
    #     server_name localhost;
    #
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #
    #     # Same location blocks as above
    # }
}
