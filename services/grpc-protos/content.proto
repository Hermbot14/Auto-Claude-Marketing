// Content Service gRPC Definitions
syntax = "proto3";

package content.v1;

service ContentService {
  // Get content
  rpc GetContent(GetContentRequest) returns (GetContentResponse);

  // List content
  rpc ListContent(ListContentRequest) returns (ListContentResponse);

  // Create content
  rpc CreateContent(CreateContentRequest) returns (CreateContentResponse);

  // Update content
  rpc UpdateContent(UpdateContentRequest) returns (UpdateContentResponse);

  // Delete content
  rpc DeleteContent(DeleteContentRequest) returns (DeleteContentResponse);

  // Publish content
  rpc PublishContent(PublishContentRequest) returns (PublishContentResponse);

  // Get content versions
  rpc GetContentVersions(GetContentVersionsRequest) returns (GetContentVersionsResponse);

  // Restore version
  rpc RestoreVersion(RestoreVersionRequest) returns (RestoreVersionResponse);
}

// Message types
message Content {
  string id = 1;
  string title = 2;
  string description = 3;
  string type = 4;
  string status = 5;
  map<string, string> content = 6;
  string template_id = 7;
  string campaign_id = 8;
  repeated string tags = 9;
  map<string, string> metadata = 10;
  string created_by = 11;
  string updated_by = 12;
  string published_at = 13;
  string scheduled_for = 14;
  int32 version = 15;
  string created_at = 16;
  string updated_at = 17;
}

message GetContentRequest {
  string id = 1;
  string user_id = 2;
}

message GetContentResponse {
  Content content = 1;
}

message ListContentRequest {
  string user_id = 1;
  int32 skip = 2;
  int32 limit = 3;
  string status = 4;
  string type = 5;
  string campaign_id = 6;
}

message ListContentResponse {
  repeated Content items = 1;
  int32 total = 2;
}

message CreateContentRequest {
  string title = 1;
  string description = 2;
  string type = 3;
  map<string, string> content = 4;
  string template_id = 5;
  repeated string tags = 6;
  map<string, string> metadata = 7;
  string user_id = 8;
}

message CreateContentResponse {
  Content content = 1;
}

message UpdateContentRequest {
  string id = 1;
  string title = 2;
  string description = 3;
  map<string, string> content = 4;
  repeated string tags = 5;
  map<string, string> metadata = 6;
  string user_id = 7;
}

message UpdateContentResponse {
  Content content = 1;
}

message DeleteContentRequest {
  string id = 1;
  string user_id = 2;
}

message DeleteContentResponse {
  bool success = 1;
}

message PublishContentRequest {
  string id = 1;
  string user_id = 2;
}

message PublishContentResponse {
  Content content = 1;
}

message GetContentVersionsRequest {
  string id = 1;
  string user_id = 2;
}

message GetContentVersionsResponse {
  repeated ContentVersion versions = 1;
}

message ContentVersion {
  string id = 1;
  string content_id = 2;
  int32 version = 3;
  map<string, string> content = 4;
  repeated string changes = 5;
  string created_by = 6;
  string created_at = 7;
}

message RestoreVersionRequest {
  string id = 1;
  string version_id = 2;
  string user_id = 3;
}

message RestoreVersionResponse {
  Content content = 1;
}
