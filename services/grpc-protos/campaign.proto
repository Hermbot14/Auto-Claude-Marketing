// Campaign Service gRPC Definitions
syntax = "proto3";

package campaign.v1;

service CampaignService {
  // Get campaign details
  rpc GetCampaign(GetCampaignRequest) returns (GetCampaignResponse);

  // List campaigns
  rpc ListCampaigns(ListCampaignsRequest) returns (ListCampaignsResponse);

  // Create campaign
  rpc CreateCampaign(CreateCampaignRequest) returns (CreateCampaignResponse);

  // Update campaign
  rpc UpdateCampaign(UpdateCampaignRequest) returns (UpdateCampaignResponse);

  // Delete campaign
  rpc DeleteCampaign(DeleteCampaignRequest) returns (DeleteCampaignResponse);

  // Launch campaign
  rpc LaunchCampaign(LaunchCampaignRequest) returns (LaunchCampaignResponse);

  // Get campaign metrics
  rpc GetCampaignMetrics(GetCampaignMetricsRequest) returns (GetCampaignMetricsResponse);
}

// Message types
message Campaign {
  string id = 1;
  string name = 2;
  string description = 3;
  string status = 4;
  string start_date = 5;
  string end_date = 6;
  string audience_segment_id = 7;
  string content_id = 8;
  double budget = 9;
  int32 target_impressions = 10;
  int32 target_clicks = 11;
  int32 target_conversions = 12;
  map<string, string> config = 13;
  string user_id = 14;
  string created_at = 15;
  string updated_at = 16;
}

message GetCampaignRequest {
  string id = 1;
  string user_id = 2;
}

message GetCampaignResponse {
  Campaign campaign = 1;
}

message ListCampaignsRequest {
  string user_id = 1;
  int32 skip = 2;
  int32 limit = 3;
  string status = 4;
}

message ListCampaignsResponse {
  repeated Campaign campaigns = 1;
  int32 total = 2;
}

message CreateCampaignRequest {
  string name = 1;
  string description = 2;
  string start_date = 3;
  string end_date = 4;
  string audience_segment_id = 5;
  string content_id = 6;
  double budget = 7;
  int32 target_impressions = 8;
  int32 target_clicks = 9;
  int32 target_conversions = 10;
  map<string, string> config = 11;
  string user_id = 12;
}

message CreateCampaignResponse {
  Campaign campaign = 1;
}

message UpdateCampaignRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  string start_date = 4;
  string end_date = 5;
  map<string, string> config = 6;
  string user_id = 7;
}

message UpdateCampaignResponse {
  Campaign campaign = 1;
}

message DeleteCampaignRequest {
  string id = 1;
  string user_id = 2;
}

message DeleteCampaignResponse {
  bool success = 1;
}

message LaunchCampaignRequest {
  string id = 1;
  string user_id = 2;
  string launch_type = 3;
}

message LaunchCampaignResponse {
  Campaign campaign = 1;
}

message GetCampaignMetricsRequest {
  string id = 1;
  string user_id = 2;
  string start_date = 3;
  string end_date = 4;
}

message GetCampaignMetricsResponse {
  int32 impressions = 1;
  int32 clicks = 2;
  int32 conversions = 3;
  double spend = 4;
  double ctr = 5;
  double cpc = 6;
  double cpa = 7;
}
