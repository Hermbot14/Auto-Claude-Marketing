  #   build:
  #     context: ./apps/frontend
  #     dockerfile: Dockerfile
  #   container_name: frontend
  #   restart: unless-stopped
  #   ports:
  #     - "4200:80"
  #   networks:
  #     - frontend
  #   environment:
  #     - API_BASE_URL=http://api-gateway:8080
