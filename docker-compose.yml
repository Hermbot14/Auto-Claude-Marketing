# Auto Claude Marketing Hub - Microservices Orchestration
#
# This docker-compose file orchestrates all microservices and infrastructure
# for the Auto Claude Marketing Hub platform.
#
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose up -d campaign   # Start specific service
#   docker-compose logs -f          # Follow logs
#   docker-compose down             # Stop all services
#
# Ports:
#   8080: API Gateway
#   8001: Campaign Service
#   8002: Content Service
#   8003: Analytics Service
#   8004: Notification Service
#   8005: Integration Service
#   8500: Consul UI
#   9090: Prometheus
#   3000: Grafana

version: '3.8'

# Networks
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

# Volumes for data persistence
volumes:
  postgres-campaign:
  postgres-analytics:
  postgres-integration:
  postgres-notification:
  mongodb-content:
  redis:
  consul-data:
  prometheus-data:
  grafana-data:
  minio-data:

services:
  # ============================================================================
  # API Gateway
  # ============================================================================
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - frontend
      - backend
    depends_on:
      - campaign-service
      - content-service
      - analytics-service
      - notification-service
      - integration-service
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Campaign Service
  # ============================================================================
  campaign-service:
    build:
      context: ./services/campaign-service
      dockerfile: Dockerfile
    container_name: campaign-service
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres-campaign:5432/campaigns
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - OTEL_ENABLED=${OTEL_ENABLED:-false}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
    networks:
      - backend
    depends_on:
      postgres-campaign:
        condition: service_healthy
      redis:
        condition: service_started
      consul:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Content Service
  # ============================================================================
  content-service:
    build:
      context: ./services/content-service
      dockerfile: Dockerfile
    container_name: content-service
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/content
      - REDIS_URL=redis://redis:6379/0
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=content-assets
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
    networks:
      - backend
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
      consul:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Analytics Service
  # ============================================================================
  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    container_name: analytics-service
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres-analytics:5432/analytics
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
    networks:
      - backend
    depends_on:
      postgres-analytics:
        condition: service_healthy
      redis:
        condition: service_started
      consul:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Notification Service
  # ============================================================================
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    restart: unless-stopped
    environment:
      - DATABASE_HOST=postgres-notification
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=notifications
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
    networks:
      - backend
    depends_on:
      postgres-notification:
        condition: service_healthy
      redis:
        condition: service_started
      consul:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8004/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Integration Service
  # ============================================================================
  integration-service:
    build:
      context: ./services/integration-service
      dockerfile: Dockerfile
    container_name: integration-service
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres-integration:5432/integrations
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - SLACK_CLIENT_ID=${SLACK_CLIENT_ID}
      - SLACK_CLIENT_SECRET=${SLACK_CLIENT_SECRET}
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
    networks:
      - backend
    depends_on:
      postgres-integration:
        condition: service_healthy
      redis:
        condition: service_started
      consul:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Service Discovery - Consul
  # ============================================================================
  consul:
    image: consul:1.18
    container_name: consul
    restart: unless-stopped
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    volumes:
      - consul-data:/consul/data
      - ./services/consul/consul-config.hcl:/consul/config/consul.hcl:ro
      - ./services/consul/services.json:/consul/config/services.json:ro
    networks:
      - frontend
      - backend
    command: agent -server -ui -bootstrap-expect=1 -config-dir=/consul/config
    healthcheck:
      test: ["CMD", "consul", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================================================
  # Databases
  # ============================================================================
  postgres-campaign:
    image: postgres:16-alpine
    container_name: postgres-campaign
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=campaigns
    volumes:
      - postgres-campaign:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-analytics:
    image: timescale/timescaledb:latest-pg16
    container_name: postgres-analytics
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=analytics
    volumes:
      - postgres-analytics:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-notification:
    image: postgres:16-alpine
    container_name: postgres-notification
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=notifications
    volumes:
      - postgres-notification:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-integration:
    image: postgres:16-alpine
    container_name: postgres-integration
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=integrations
    volumes:
      - postgres-integration:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=content
    volumes:
      - mongodb-content:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Storage (S3-compatible for development)
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - minio-data:/data
    networks:
      - backend

  # ============================================================================
  # Monitoring
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
      - ./services/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./services/monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
    networks:
      - backend
    depends_on:
      - cadvisor

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana-data:/var/lib/grafana
      - ./services/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - frontend
      - backend
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    restart: unless-stopped
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "14268:14268"
      - "14250:14250"
      - "9411:9411"
      - "4317:4317"
      - "4318:4318"
      - "4319:4319"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - frontend
      - backend

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - backend
    privileged: true

  # ============================================================================
  # Optional: Frontend (for development)
  # ============================================================================
