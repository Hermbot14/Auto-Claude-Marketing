# Performance Budget CI Workflow
#
# Runs performance audits on every PR to catch regressions before merge.
# Uses Lighthouse CI to measure Core Web Vitals and bundle size analysis.
#
# Triggers:
# - Pull requests to main/develop
# - Push to main/develop (for baseline updates)
# - Manual workflow dispatch

name: Performance

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/performance.yml'
      - 'performance-budget.config.json'
  push:
    branches: [main, develop]
    paths:
      - 'apps/frontend/**'
      - '.github/workflows/performance.yml'
      - 'performance-budget.config.json'
  workflow_dispatch:
    inputs:
      update-baseline:
        description: 'Save results as new baseline'
        required: false
        type: boolean
        default: false

concurrency:
  group: performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  # --------------------------------------------------------------------------
  # Build frontend for performance testing
  # --------------------------------------------------------------------------
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    outputs:
      build-dir: ${{ steps.build.outputs.dir }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: apps/frontend
        run: bun install --frozen-lockfile

      - name: Build frontend
        id: build
        working-directory: apps/frontend
        run: |
          bun run build
          echo "dir=out" >> $GITHUB_OUTPUT

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: apps/frontend/out/
          retention-days: 1

  # --------------------------------------------------------------------------
  # Bundle size analysis
  # --------------------------------------------------------------------------
  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: apps/frontend/out/

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Check bundle sizes
        id: bundle-check
        working-directory: apps/frontend
        run: |
          bun run scripts/performance-budget.js
        continue-on-error: true

      - name: Generate bundle report
        if: always()
        working-directory: apps/frontend
        run: |
          bun run scripts/performance-budget.js --save-baseline
        continue-on-error: true

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const basePath = 'apps/frontend/.tmp/performance-baseline.json';

            let comment = '## 📊 Performance Budget Results\n\n';

            if (fs.existsSync(basePath)) {
              const results = JSON.parse(fs.readFileSync(basePath, 'utf-8'));
              comment += '### Bundle Size Analysis\n\n';
              comment += '| Metric | Actual | Budget | Status |\n';
              comment += '|--------|--------|--------|--------|\n';

              for (const result of results.results || []) {
                const format = (val) => {
                  if (result.metric.toLowerCase().includes('size')) {
                    return (val / 1024 / 1024).toFixed(2) + ' MB';
                  }
                  return val;
                };
                const status = result.passed ? '✅' : '❌';
                comment += `| ${result.metric} | ${format(result.actual)} | ${format(result.budget)} | ${status} |\n`;
              }
            } else {
              comment += '⚠️ Bundle size analysis results not available.\n';
            }

            comment += '\n---\n*This comment is automatically generated by the performance workflow.*';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # --------------------------------------------------------------------------
  # Lighthouse CI audit
  # --------------------------------------------------------------------------
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: apps/frontend/out/

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: apps/frontend
        run: |
          bun install --frozen-lockfile
          bun add -d lighthouse chrome-launcher

      - name: Start HTTP server for build
        working-directory: apps/frontend/out
        run: |
          bunx --bun http-server . -p 3000 &
          sleep 5

      - name: Run Lighthouse CI
        id: lighthouse
        working-directory: apps/frontend
        run: |
          bun run scripts/performance-budget.js --lighthouse
        env:
          LIGHTHOUSE_PORT: '3000'

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: apps/frontend/.tmp/
          retention-days: 30

      - name: Set commit status
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const basePath = 'apps/frontend/.tmp/performance-baseline.json';

            let state = 'success';
            let description = 'All budgets passed';

            if (fs.existsSync(basePath)) {
              const results = JSON.parse(fs.readFileSync(basePath, 'utf-8'));
              const failed = (results.results || []).filter(r => !r.passed);

              if (failed.length > 0) {
                state = 'failure';
                description = `${failed.length} budget(s) exceeded`;
              }
            }

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: state,
              context: 'performance/lighthouse',
              description: description
            });

  # --------------------------------------------------------------------------
  # Regression detection
  # --------------------------------------------------------------------------
  regression-check:
    name: Regression Detection
    runs-on: ubuntu-latest
    needs: [bundle-size, lighthouse]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for comparison

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Compare with baseline
        id: compare
        working-directory: apps/frontend
        run: |
          # Get baseline from main branch
          git checkout origin/main -- .tmp/performance-baseline.json 2>/dev/null || true

          # Run comparison
          bun run scripts/performance-budget.js --compare .tmp/performance-baseline.json
        continue-on-error: true

      - name: Create regression alert
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## ⚠️ Performance Regression Detected

            This PR introduces performance regressions compared to the baseline. Please review the changes before merging.

            ### Actions Required:
            1. Review the bundle size changes
            2. Optimize lazy loading or code splitting
            3. Consider deferring non-critical resources
            4. Re-run performance checks after optimization

            See the [Performance Budgets](https://github.com/AndyMik90/Auto-Claude-Marketing/blob/main/apps/frontend/performance-budget.config.json) for details.

            ---
            *Automatically generated by performance workflow*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # --------------------------------------------------------------------------
  # Update baseline (manual or on merge to main)
  # --------------------------------------------------------------------------
  update-baseline:
    name: Update Baseline
    runs-on: ubuntu-latest
    needs: [bundle-size, lighthouse]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.update-baseline)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Setup Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update performance baseline
        run: |
          cp -r artifacts/lighthouse-results/performance-baseline.json \
                apps/frontend/.tmp/performance-baseline.json

          git add apps/frontend/.tmp/performance-baseline.json
          git commit -m "chore: update performance baseline [skip ci]"
          git push
