name: Documentation

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'docs/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "docs"
  cancel-in-progress: true

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install Dependencies
        working-directory: ./docs
        run: bun install

      - name: Build VitePress
        working-directory: ./docs
        run: bun run docs:build

      - name: Build Storybook
        working-directory: ./docs
        run: bun run build-storybook

      - name: Upload VitePress Build
        uses: actions/upload-artifact@v4
        with:
          name: vitepress-dist
          path: docs/.vitepress/dist
          retention-days: 7

      - name: Upload Storybook Build
        uses: actions/upload-artifact@v4
        with:
          name: storybook-dist
          path: docs/storybook-static
          retention-days: 7

  deploy-preview:
    name: Deploy Preview
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download VitePress Build
        uses: actions/download-artifact@v4
        with:
          name: vitepress-dist
          path: ./dist

      - name: Deploy to Preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=auto-claude-marketing-docs-preview

      - name: Comment PR with Preview URL
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '📚 Documentation preview is ready!\n\n**VitePress Preview**: https://auto-claude-marketing-docs-preview.pages.dev\n\nThis preview will be updated automatically with new commits.'
            })

  deploy-production:
    name: Deploy to Production
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download VitePress Build
        uses: actions/download-artifact@v4
        with:
          name: vitepress-dist
          path: ./dist

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./dist

      - name: Deploy Storybook to Netlify
        uses: nwtgck/actions-netlify@v2.1
        with:
          publish-dir: ./storybook-static
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: true
          enable-commit-comment: true
          overwrites-pull-request-comment: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID_STORYBOOK }}

  deploy-api-explorer:
    name: Deploy API Explorer
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy API Explorer to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: auto-claude-marketing-api-explorer
          directory: docs/public/api-explorer
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  algolia-index:
    name: Update Algolia Index
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy-production
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install Dependencies
        working-directory: ./docs
        run: bun install

      - name: Build Documentation
        working-directory: ./docs
        run: bun run docs:build

      - name: Run Algolia Crawler
        run: |
          docker run -e APPLICATION_ID=${{ secrets.ALGOLIA_APPLICATION_ID }} \
                     -e API_KEY=${{ secrets.ALGOLIA_API_KEY }} \
                     algolia/docsearch-scraper

  notify:
    name: Notify Success
    if: success()
    needs: [build, deploy-production]
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord Notification
        uses: discord-actions/message@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          content: |
            ✅ Documentation deployed successfully!
            **VitePress**: https://docs.auto-claude-marketing.com
            **Storybook**: https://storybook.auto-claude-marketing.com
            **API Explorer**: https://api-explorer.auto-claude-marketing.com
